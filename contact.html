<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuzhat Khan - Contacts</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>


    <header>
        <button class="hamburger" id="hamburger-btn" aria-label="Toggle Navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <nav class="navbar">
            <a href="index.html" class="nav-item">Home</a>
            <a href="about.html" class="nav-item">About</a>
            <a href="project.html" class="nav-item">Projects</a>
            <a href="achievement.html" class="nav-item">Achievements</a>
            <a href="contact.html" class="nav-item active">Contact</a>
        </nav>
    </header>

    <main class="container">

        <section class="contact-section">

        </section>

        <section class="contact-container">

            <!-- Contact Info Panel -->
            <div class="contact-info">
                <h3>Contact Information</h3>
                <p class="info-desc">Feel free to reach out to me directly through any of these platforms.</p>

                <div class="info-list">
                    <div class="info-item">
                        <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
                        <div>
                            <span>Email</span>
                            <p>nuzhatkhanarpa2005@gmail.com</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                        <div>
                            <span>Location</span>
                            <p>Halishahar, Chittagong, Bangladesh</p>
                        </div>
                    </div>
                </div>

                <div class="social-icons">
                    <a href="https://www.facebook.com" target="_blank" class="icon-link facebook" title="Facebook"><i
                            class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://github.com/nuzhat-khan" target="_blank" class="icon-link github" title="GitHub"><i
                            class="fa-brands fa-github"></i></a>
                    <a href="https://www.linkedin.com/" target="_blank" class="icon-link linkedin" title="LinkedIn"><i
                            class="fa-brands fa-linkedin-in"></i></a>
                    <a href="mailto:nuzhatkhanarpa2005@gmail.com" class="icon-link gmail" title="Gmail"><i
                            class="fa-solid fa-envelope"></i></a>
                </div>
            </div>

            <form action="https://formsubmit.co/nuzhatkhanarpa2005@gmail.com" method="POST" class="contact-form">

                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="New Portfolio Contact Message!">
                <input type="hidden" name="_template" value="table">

                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Karim Uddin" required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Project Collaboration" required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..."
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Send Message</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>

        </section>
    </main>
    <script>
        const hamburger = document.getElementById('hamburger-btn');
        const navMenu = document.querySelector('.navbar');
        const navLinks = document.querySelectorAll('.nav-item');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
    </script>
</body>

</html>
